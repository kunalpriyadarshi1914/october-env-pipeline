
trigger:
  branches:
    include:
      - main
      - feature/*
  paths:
    include:
      - parent_modules/${{ parameters.environment }}/**

parameters:
- name: environment
  type: string
  values:
    - 'dev'
    - 'prod'

- name: KyaScanChalega
  displayName: 'Scan chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

- name: KyaPlanChalega
  displayName: ' Plan chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

- name: KyaApplyChalega
  displayName: ' Apply chalega kya?'
  type: string
  default: 'chalega bhai'
  values:
    - 'chalega bhai'
    - 'nahi chalega bhai'

pool: kunal-pool

variables:
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/parent_modules/${{ parameters.environment }}'
  terraformVarFile: 'terraform.tfvars'

stages:

# =========================
# STAGE 1: SECRET SCAN
# =========================

- stage: Scan
  displayName: ' Secret Scan'
  condition: eq('${{ parameters.KyaScanChalega }}', 'chalega bhai')

  jobs:
  - job: Scan
    steps:
    - checkout: self

    - task: PowerShell@2
      displayName: ' Trufflehog Scan'
      inputs:
        targetType: inline
        script: |
          $path = "$(terraformWorkingDirectory)"

          if (!(Test-Path $path)) {
            throw "Dev directory not found: $path"
          }

          trufflehog filesystem "$path" --results=verified,unknown

# =========================
# STAGE 2: TERRAFORM PLAN
# =========================

- stage: Plan
  displayName: ' Terraform Init and Plan'

  dependsOn: Scan

  condition: |
    and(
      in(dependencies.Scan.result, 'Succeeded', 'Skipped'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai')
    )

  jobs:
  - job: Plan
    steps:

    - checkout: self

    # Check Terraform files

    - task: PowerShell@2
      displayName: 'Check Dev Terraform Files'
      inputs:
        targetType: inline
        script: |
          $path = "$(terraformWorkingDirectory)"
          $varFile = "$path/$(terraformVarFile)"

          Write-Host "Working Directory: $path"
          Write-Host "Checking Terraform files..."

          if (!(Test-Path $path)) {
            throw "Dev directory not found"
          }

          if (!(Test-Path $varFile)) {
            throw "Terraform variable file not found: $varFile"
          }

          Write-Host "terraform.tfvars FOUND"

          Get-ChildItem $path

    # Terraform Init

    - task: TerraformTask@5
      displayName: ' Init'
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: 'shiva-svc'
        backendAzureRmStorageAccountName: 'hyd1914storage'
        backendAzureRmContainerName: 'pipeline-container'
        backendAzureRmKey: 'dev.tfstate'

    # Terraform Plan

    - task: TerraformTask@5
      displayName: ' Plan'
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: '$(terraformWorkingDirectory)'
        commandOptions: '-var-file="$(terraformVarFile)" -input=false'
        environmentServiceNameAzureRM: 'shiva-svc'

# =========================
# STAGE 3: MANUAL APPROVAL
# =========================

- stage: Approval
  displayName: 'Approve  Apply'

  dependsOn: Plan

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai'),
      eq('${{ parameters.KyaApplyChalega }}', 'chalega bhai')
    )

  pool: server

  jobs:
  - job: Approval
    timeoutInMinutes: 1440

    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: 'kp4u2011@gmail.com'
        approvers: 'kp4u2011@gmail.com'
        instructions: 'Approve Dev changes.'
        onTimeout: reject

# =========================
# STAGE 4: TERRAFORM APPLY
# =========================

- stage: Apply
  displayName: ' Terraform Apply'

  dependsOn:
    - Plan
    - Approval

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq('${{ parameters.KyaPlanChalega }}', 'chalega bhai'),
      eq('${{ parameters.KyaApplyChalega }}', 'chalega bhai')
    )

  jobs:
  - job: DevApply
    steps:

    - checkout: self

    # Terraform Init

    - task: TerraformTask@5
      displayName: ' Init'
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(terraformWorkingDirectory)'
        backendServiceArm: 'shiva-svc'
        backendAzureRmStorageAccountName: 'hyd1914storage'
        backendAzureRmContainerName: 'pipeline-container'
        backendAzureRmKey: 'dev.tfstate'

    # Terraform Apply

    - task: TerraformTask@5
      displayName: ' Apply'
      inputs:
        provider: azurerm
        command: apply
        workingDirectory: '$(terraformWorkingDirectory)'
        commandOptions: '-var-file="$(terraformVarFile)" -input=false -auto-approve'
        environmentServiceNameAzureRM: 'shiva-svc'
